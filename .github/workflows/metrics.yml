name: GitHub Metrics

on:
  # Update automatically every day at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allow running manually from the Actions tab
  workflow_dispatch:
  # Run on every commit to the main branch
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Generates general stats
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Cairo
          # Generates the top languages section
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8